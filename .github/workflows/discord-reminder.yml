name: Discord announcements
on:
  schedule:
    - cron: '7,37 * * * *'   # ตรวจทุก 30 นาที (นาทีที่ 7 และ 37 ของทุกชั่วโมง)
  workflow_dispatch:
    inputs:
      force_all:
        description: 'true = ส่งทุกประกาศที่ตั้งเวลาไว้ทันที ไม่รอถึงเวลา (ใช้ทดสอบ)'
        required: false
        default: 'false'
concurrency:
  group: discord-announce
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/discord-announce.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DISCORD_WEBHOOK_ANNOUNCE: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCE }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
