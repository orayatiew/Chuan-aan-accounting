name: Discord notify
on:
  schedule:
    - cron: '0 2 * * *'     # 09:00 เวลาไทย ทุกวัน → แจ้งเตือนเรียกเก็บเงิน (ส่งจริงเฉพาะวันที่ 30 และวันที่ 1)
    - cron: '7,37 * * * *'  # ทุก 30 นาที → ตรวจและส่งประกาศที่ถึงเวลา
  workflow_dispatch:
    inputs:
      task:
        description: 'งานที่จะรัน: ping (ทดสอบ Webhook) / reminder (เรียกเก็บเงิน) / announce (ประกาศ) / both'
        required: false
        default: 'both'
      mode:
        description: 'ทดสอบเรียกเก็บเงิน: pay หรือ unpaid (เว้นว่าง = ตามวันที่จริง)'
        required: false
        default: ''
      force_all:
        description: 'ทดสอบประกาศ: true = ส่งทุกประกาศที่ตั้งเวลาไว้ทันที'
        required: false
        default: 'false'
concurrency:
  group: discord-notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - name: Run notify script
        run: |
          # หาไฟล์สคริปต์รวมจาก "เนื้อหา" ไม่ผูกกับชื่อไฟล์หรือโฟลเดอร์ (อยู่ที่ราก/ใน scripts/ ชื่ออะไรก็เจอ)
          FILE=$(grep -rl --include='*.mjs' --exclude-dir=node_modules --exclude-dir=.git 'export async function runReminder' . | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::ไม่พบไฟล์สคริปต์รวม (discord-notify.mjs) ใน repo — ให้เพิ่มไฟล์นี้ก่อน"
            echo "ไฟล์ทั้งหมดใน repo ตอนนี้:"
            find . -path ./node_modules -prune -o -path ./.git -prune -o -type f -print
            exit 1
          fi
          echo "ใช้ไฟล์: $FILE"
          node "$FILE"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_ANNOUNCE: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCE }}
          SCHEDULE: ${{ github.event.schedule }}
          TASK: ${{ github.event.inputs.task }}
          MODE: ${{ github.event.inputs.mode }}
          FORCE_ALL: ${{ github.event.inputs.force_all }}
