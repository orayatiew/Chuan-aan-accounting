name: Discord reminder
on:
  schedule:
    - cron: '0 2 * * *'   # ทุกวัน 09:00 เวลาไทย (สคริปต์เลือกส่งเฉพาะวันที่ 30 และวันที่ 1)
  workflow_dispatch:
    inputs:
      mode:
        description: 'ทดสอบ: pay หรือ unpaid (เว้นว่าง = ตามวันที่จริง)'
        required: false
        default: ''
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/discord-reminder.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_MODE: ${{ github.event.inputs.mode }}
